# Publish a Docker image to GitHub Container Registry and create the GitHub Release.
#
# Triggered by an annotated v* tag from ./scripts/release.sh.
# linux/amd64 and linux/arm64 are built natively (ubuntu-24.04 / ubuntu-24.04-arm)
# and joined into one multi-arch manifest. QEMU is not used.
# Action majors verified 2026-09-26:
#   actions/checkout@v7 (7.0.1)
#   actions/setup-python@v7 (7.0.0)
#   actions/upload-artifact@v7 (7.0.1)
#   actions/download-artifact@v8 (8.0.1)
#   docker/login-action@v4 (4.6.0)
#   docker/setup-buildx-action@v4 (4.4.1)
#   docker/metadata-action@v6 (6.2.0)
#   docker/build-push-action@v7 (7.4.0)

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test and check release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta_version.outputs.version }}
      notes: ${{ steps.meta_version.outputs.notes }}
      stamp: ${{ steps.stamp.outputs.value }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Image name
        id: image
        run: |
          set -euo pipefail
          printf 'name=%s/%s\n' "${REGISTRY}" "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"

      - name: Check version and release notes
        id: meta_version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app_version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app/version.py | head -n 1 | tr -d '[:space:]')"
          notes="release-notes/RELEASE_NOTES_${version}.md"
          if [[ -z "${app_version}" ]]; then
            echo "Could not read VERSION from app/version.py" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${version}" ]]; then
            echo "Tag ${tag} does not match app.version.VERSION=${app_version}" >&2
            exit 1
          fi
          if [[ ! -f "${notes}" ]]; then
            echo "Release notes file not found: ${notes}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build timestamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.test.outputs.image }}
          labels: |
            org.opencontainers.image.title=CursorPace Sync Server
            org.opencontainers.image.description=LAN sync server for CursorPace usage samples
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_TIMESTAMP=${{ needs.test.outputs.stamp }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ needs.test.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish image and GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.test.outputs.image }}
          labels: |
            org.opencontainers.image.title=CursorPace Sync Server
            org.opencontainers.image.description=LAN sync server for CursorPace usage samples
            org.opencontainers.image.licenses=MIT
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_IMAGE: ${{ needs.test.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        id: inspect
        env:
          REGISTRY_IMAGE: ${{ needs.test.outputs.image }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}" | awk '/^Digest:/ { print $2; exit }')"
          if [[ -z "${digest}" ]]; then
            echo "Could not inspect image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="${{ needs.test.outputs.notes }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes
          fi
          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file "${notes}"

      - name: Summarize
        run: |
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "- Image tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - `/' | sed 's/$/`/'
            echo "- Digest: \`${{ steps.inspect.outputs.digest }}\`"
            echo "- GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
