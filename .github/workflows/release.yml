# Publish a Docker image to GitHub Container Registry and create the GitHub Release.
#
# Triggered by an annotated v* tag from ./scripts/release.sh.
# Action majors verified 2026-09-18:
#   actions/checkout@v7 (7.0.1)
#   actions/setup-python@v7 (7.0.0)
#   docker/login-action@v4 (4.6.0)
#   docker/setup-qemu-action@v4 (4.4.0)
#   docker/setup-buildx-action@v4 (4.4.1)
#   docker/metadata-action@v6 (6.2.0)
#   docker/build-push-action@v7 (7.4.0)

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Publish image and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version and release notes
        id: meta_version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app_version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app/version.py | head -n 1 | tr -d '[:space:]')"
          notes="release-notes/RELEASE_NOTES_${version}.md"
          if [[ -z "${app_version}" ]]; then
            echo "Could not read VERSION from app/version.py" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${version}" ]]; then
            echo "Tag ${tag} does not match app.version.VERSION=${app_version}" >&2
            exit 1
          fi
          if [[ ! -f "${notes}" ]]; then
            echo "Release notes file not found: ${notes}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=CursorPace Sync Server
            org.opencontainers.image.description=LAN sync server for CursorPace usage samples
            org.opencontainers.image.licenses=MIT
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest

      - name: Build timestamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_TIMESTAMP=${{ steps.stamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="${{ steps.meta_version.outputs.notes }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes
          fi
          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file "${notes}"

      - name: Summarize
        run: |
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "- Image tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - `/' | sed 's/$/`/'
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
