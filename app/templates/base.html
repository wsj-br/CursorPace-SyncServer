<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CursorPace Sync{% endblock %}</title>
  <link rel="icon" href="/static/cursor_pace.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/cursor_pace.png" />
  <link rel="apple-touch-icon" href="/static/cursor_pace.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-mark" src="/static/cursor_pace.png" width="36" height="36" alt="" />
      CursorPace Sync
    </a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link{% if active_page == 'dashboard' %} is-active{% endif %}" href="/" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a class="nav-link{% if active_page == 'tokens' %} is-active{% endif %}" href="/tokens" {% if active_page == 'tokens' %}aria-current="page"{% endif %}>Tokens</a>
      <a class="nav-link{% if active_page == 'machines' %} is-active{% endif %}" href="/machines" {% if active_page == 'machines' %}aria-current="page"{% endif %}>Machines</a>
      <a class="nav-link{% if active_page == 'data' %} is-active{% endif %}" href="/data" {% if active_page == 'data' %}aria-current="page"{% endif %}>Data</a>
      <a class="nav-link{% if active_page == 'backup' %} is-active{% endif %}" href="/backup" {% if active_page == 'backup' %}aria-current="page"{% endif %}>Backup</a>
    </nav>
    <div class="nav-end">
      <a class="btn btn-ghost" href="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/>
        </svg>
        Refresh
      </a>
      <form method="post" action="/logout">
        <button class="btn btn-ghost" type="submit">Logout</button>
      </form>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <script src="/static/app.js" defer></script>
</body>
</html>
