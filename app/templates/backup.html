{% extends "base.html" %}
{% block title %}Backup — CursorPace Sync{% endblock %}
{% block content %}
<h1>Backup</h1>
{% if message %}<p class="ok">{{ message }}</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p><a href="/backup/export"><button>Export backup (.zip)</button></a></p>
<h2>Import</h2>
<form method="post" action="/backup/import" enctype="multipart/form-data">
  <input type="file" name="file" accept=".zip" required />
  <button type="submit">Import</button>
</form>
{% endblock %}
